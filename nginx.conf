server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires 1h;
    }

    location = /robots.txt {
        expires 1d;
    }

    location = /sitemap.xml {
        expires 1h;
    }

    location ~* \.(css|js|svg|woff2?|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}