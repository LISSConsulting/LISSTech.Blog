baseURL: https://gaxffo2nmmt8nswkr8yj0ova.clfy-a.lissonline.com/
locale: en-us
title: 'LISSTech.Blog'
copyright: 'Michal Wisniowski'
theme: PaperMod

enableRobotsTXT: true
enableGitInfo: false

permalinks:
  posts: /posts/:slug/

pagination:
  pagerSize: 10

params:
  env: production
  description: 'Real infrastructure investigations.'
  profileMode:
    enabled: false
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  mainSections:
    - posts
  editorial:
    readLabel: 'Read the investigation'
    archiveLabel: 'All articles'
    rssLabel: 'RSS'
  assets:
    favicon: /favicon.svg
  socialIcons:
    - name: github
      title: 'GitHub'
      url: 'https://github.com/mwisniowski'
    - name: linkedin
      title: 'LinkedIn'
      url: 'https://www.linkedin.com/in/mwisniowski/'

menu:
  main:
    - identifier: home
      name: 'Home'
      url: '/'
      weight: 10
    - identifier: posts
      name: 'Posts'
      url: '/posts/'
      weight: 20
    - identifier: about
      name: 'About'
      url: '/about/'
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
